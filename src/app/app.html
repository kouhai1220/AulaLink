@if (authService.isAuthenticated()) {
  <div class="app-shell">
    <main class="app-content"><router-outlet /></main>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a class="nav-item" routerLink="/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5Z"/>
        </svg>
        <small>Inicio</small>
      </a>
      <a class="nav-item" routerLink="/calendario" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
          <path d="M7 2.75a1 1 0 0 1 1 1V4h8v-.25a1 1 0 1 1 2 0V4h1a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v-.25a1 1 0 0 1 1-1Zm12 8H5v8h14v-8Zm-9 2v2H7v-2h3Zm5 0v2h-3v-2h3Zm4 0v2h-3v-2h3ZM5 8.5h14V6H5v2.5Z"/>
        </svg>
        <small>Agenda</small>
      </a>
      <a routerLink="/nueva-tarea" class="nav-add" aria-label="Nueva tarea">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-add-icon">
          <path d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5Z"/>
        </svg>
      </a>
      <a class="nav-item" routerLink="/tasks" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
          <path d="M8 5.5A2.5 2.5 0 0 1 10.5 3h7A2.5 2.5 0 0 1 20 5.5v11A2.5 2.5 0 0 1 17.5 19h-7A2.5 2.5 0 0 1 8 16.5v-11Zm2 0a.5.5 0 0 0-.5.5v11c0 .28.22.5.5.5h7a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5h-7Zm-4.5 1.5h1.25a1 1 0 0 1 0 2H5.5a1 1 0 1 1 0-2Zm0 5h1.25a1 1 0 0 1 0 2H5.5a1 1 0 1 1 0-2Zm0 5h1.25a1 1 0 0 1 0 2H5.5a1 1 0 1 1 0-2Z"/>
        </svg>
        <small>Tareas</small>
      </a>
      <a class="nav-item" routerLink="/progreso" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon">
          <path d="M12 3.5A8.5 8.5 0 1 1 3.5 12 8.51 8.51 0 0 1 12 3.5Zm0 2A6.5 6.5 0 1 0 18.5 12 6.51 6.51 0 0 0 12 5.5Zm.75 2.25h-1.5v5.25h4.5v-1.5h-3V7.75Z"/>
        </svg>
        <small>Progreso</small>
      </a>
    </nav>
  </div>
} @else {
    <div class="auth-shell"><router-outlet /></div>
}
